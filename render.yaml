services:
  - type: web
    name: post-maker-shtunda13
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/config
    autoDeployTrigger: commit
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_IMAGE_MODEL
        value: gemini-3.1-flash-image-preview
      - key: GEMINI_TEXT_MODEL
        value: gemini-2.5-flash
      - key: AI_KEYS_POLICY
        value: free-tier-only
      - key: AI_FREE_MODELS_ONLY
        value: "true"
      - key: AI_BILLING_ALLOWED
        value: "false"
      - key: AI_PAID_MODELS_ALLOWED
        value: "false"
      - key: DISABLE_PAID_AI_TOOLS
        value: "true"
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: OPENROUTER_FREE_MODELS_ONLY
        value: "true"
      - key: GEMINI_FREE_TIER_ONLY
        value: "true"
      - key: GROQ_FREE_PLAN_ONLY
        value: "true"
