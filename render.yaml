services:
  - type: web
    name: post-maker-shtunda13
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/config
    autoDeployTrigger: commit
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_IMAGE_MODEL
        value: gemini-3.1-flash-image-preview
      - key: GEMINI_IMAGE_SIZE
        value: 2K
      - key: GEMINI_TEXT_MODEL
        value: gemini-2.5-flash
      - key: AI_IMAGE_PROVIDER_ORDER
        value: gemini,cloudflare,huggingface,qwen,pollinations
      - key: IMAGE_PROVIDER_TIMEOUT_MS
        value: "90000"
      - key: GEMINI_IMAGE_DAILY_LIMIT
        value: "20"
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_IMAGE_MODEL
        value: "@cf/black-forest-labs/flux-1-schnell"
      - key: CLOUDFLARE_IMAGE_DAILY_LIMIT
        value: "40"
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: HUGGINGFACE_IMAGE_MODEL
        value: black-forest-labs/FLUX.1-schnell
      - key: HUGGINGFACE_IMAGE_DAILY_LIMIT
        value: "6"
      - key: DASHSCOPE_IMAGE_ENABLED
        value: "false"
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: DASHSCOPE_IMAGE_MODEL
        value: qwen-image-2.0-pro
      - key: DASHSCOPE_IMAGE_DAILY_LIMIT
        value: "10"
      - key: POLLINATIONS_IMAGE_ENABLED
        value: "true"
      - key: POLLINATIONS_BASE_URL
        value: https://image.pollinations.ai
      - key: POLLINATIONS_IMAGE_MODEL
        value: flux
      - key: POLLINATIONS_TIMEOUT_MS
        value: "60000"
      - key: POLLINATIONS_RETRY_ATTEMPTS
        value: "3"
      - key: POLLINATIONS_RETRY_DELAY_MS
        value: "4500"
      - key: POLLINATIONS_ENHANCE_PROMPT
        value: "false"
      - key: POLLINATIONS_IMAGE_DAILY_LIMIT
        value: "50"
      - key: POLLINATIONS_API_KEY
        sync: false
      - key: ALLOW_LOCAL_SVG_FALLBACK
        value: "false"
      - key: AI_KEYS_POLICY
        value: free-tier-only
      - key: AI_FREE_MODELS_ONLY
        value: "true"
      - key: AI_BILLING_ALLOWED
        value: "false"
      - key: AI_PAID_MODELS_ALLOWED
        value: "false"
      - key: DISABLE_PAID_AI_TOOLS
        value: "true"
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: OPENROUTER_FREE_MODELS_ONLY
        value: "true"
      - key: GEMINI_FREE_TIER_ONLY
        value: "true"
      - key: GROQ_FREE_PLAN_ONLY
        value: "true"
